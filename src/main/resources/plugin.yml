name: GardenTrade
version: '${project.version}'
main: com.herasgarden.gardentrade.GardenTrade
api-version: '26.2'
author: Hera's Garden
website: https://herasgarden.net
description: Unified Garden storefronts and shop transactions.
depend: [GardenCore, GardenLands]

commands:
  business:
    description: Create and manage Garden businesses, workplaces, positions, staff, schedules, doors, and signs.
    usage: /business <create|list|workplace|position|hire|fire>
  shop:
    description: Create and use Garden shops.
    usage: /shop <create|createbuy|info|buy|settings|link|unlink|appearance|setprice|setquantity|mode|delete|cleanup|list>

permissions:
  gardentrade.business:
    default: true
  gardentrade.business.admin:
    default: op
  gardentrade.shop:
    default: true
  gardentrade.shop.create:
    default: true
  gardentrade.shop.company.create:
    description: Create storefronts owned by Garden companies when the organization role permits it.
    default: true
  gardentrade.shop.company.list:
    description: View Garden company storefronts.
    default: true
  gardentrade.shop.government.create:
    description: Create storefronts owned by Garden governments when the organization role permits it.
    default: true
  gardentrade.shop.government.list:
    description: View Garden government storefronts.
    default: true
  gardentrade.shop.sign:
    description: Create stock-backed player sign shops.
    default: true
  gardentrade.shop.admin:
    default: op
